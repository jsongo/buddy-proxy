[project]
name = "buddy-proxy"
version = "2.0.4"
description = "Local OpenAI/Responses/Anthropic compatible proxy for CodeBuddy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx[socks]>=0.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
buddy-proxy = "buddy_proxy.__main__:main"
trae-cli = "buddy_proxy.trae_provider:_cli"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"buddy_proxy.web" = ["models_config.json", "static/*.html"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 先阻断语法错误和未定义名称；其余历史 lint 债务后续逐步收紧。
select = ["E9", "F821"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
